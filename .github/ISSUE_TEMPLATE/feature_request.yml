name: Feature Request
description: Propose a new feature or improvement
title: "feat: "
labels: ["enhancement", "status:needs-review"]
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: Pre-flight Checks
      options:
        - label: I have searched existing issues and this is not a duplicate
          required: true
        - label: I understand this issue needs status:approved before a PR can be opened
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem Description
      description: The pain point this feature solves
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How it should work from the user's perspective
    validations:
      required: true
  - type: dropdown
    id: module
    attributes:
      label: Módulo
      description: Módulo dueño de este cambio. Define quién lo toma. Ver AGENTS.md §3.
      options:
        - "match (P — Partida)"
        - "session (S — Sesión)"
        - "review (R — Revisión)"
        - "triggers (G — Gatillos)"
        - "core / infra / ui (territorio compartido — revisión de los dos)"
        - "app (shell, routing, nav)"
        - "tooling / CI / docs"
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Alcance por archivo
      description: >-
        Las rutas exactas que este cambio puede tocar, una por línea. Se admiten globs.
        CI compara los archivos del PR contra esta lista y falla si te salís.
        Si no sabés el alcance todavía, el issue no está listo.
      placeholder: |
        src/modules/match/**
        src/modules/match/__tests__/**
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Criterios de aceptación
      description: >-
        Verificables: una persona tiene que poder decir sí o no mirando el resultado.
        "Que funcione bien" no es un criterio.
      placeholder: |
        - [ ] Guardar una entrada con la red apagada la persiste local y encola la op en el outbox
        - [ ] El botón vuelve a estado normal en menos de 300ms, sin esperar red
    validations:
      required: true
  - type: dropdown
    id: test_level
    attributes:
      label: Nivel de test esperado
      description: Ver ADR-0006 para qué se testea y qué explícitamente no.
      options:
        - "unit"
        - "component"
        - "integration"
        - "e2e"
        - "unit + component"
        - "ninguno (justificar abajo)"
    validations:
      required: true
  - type: input
    id: adr
    attributes:
      label: ADR relacionado
      description: Obligatorio si el cambio altera una decisión de arquitectura. Si hace falta un ADR nuevo, decilo acá.
      placeholder: "ADR-0003, o: necesita ADR nuevo sobre X"
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Mockups, examples, references
    validations:
      required: false
